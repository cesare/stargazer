name: schema-ci

on:
  push:
    branches: ["main"]
    paths:
      - "schema/**"
      - ".github/**"
  pull_request:
    branches: ["main"]
    paths:
      - "schema/**"
      - ".github/**"

defaults:
  run:
    working-directory: ./schema

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup node
      uses: actions/setup-node@v7
      with:
        node-version: "24.2.0"
        cache: "npm"
        cache-dependency-path: 'schema/package-lock.json'
    - name: Install dependencies
      run: npm install
