services:
  backend:
    user: nobody
    build:
      context: ./backend
    command: ["./stargazer"]
    ports:
      - "3000:3000"

  frontend:
    user: node
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host=0.0.0.0", "--port=3001"]
    ports:
      - "3001:3001"

  postgres:
    image: postgres:18
    volumes:
      - postgres-volume:/var/lib/postgresql
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB=stargazer
    ports:
      - "5432:5432"
    restart: always

  schema:
    user: node
    build:
      context: ./schema
    volumes:
      - ./schema:/app
      - schema-node-modules:/app/node_modules
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/stargazer?schema=public
    depends_on:
      - postgres

volumes:
  frontend-node-modules:
  postgres-volume:
  schema-node-modules:
